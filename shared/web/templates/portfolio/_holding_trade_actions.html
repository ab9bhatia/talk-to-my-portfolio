{% set decision = h.get('decision_presentation') or {} %}
<div class="holding-trade-actions decision-readiness-gate">
  <span class="holding-trade-label">{{ decision.get('readiness_label') or 'Decision unavailable' }}</span>
  <a class="btn btn-sm btn-ghost" href="{{ app_path('/portfolio/advisor') }}">Review decision</a>
  <span class="cell-muted">Orders stay disabled until the decision and account checks are reviewed.</span>
</div>
