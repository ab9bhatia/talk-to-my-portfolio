{% if h.get('rating_label') %}
<span
  class="rating-badge rating-badge-compact rating-{{ h.get('rating_slug') or 'unknown' }}"
  title="Covered external analyst consensus: {{ h.get('rating_label') }}. Context only; not the portfolio advisor decision."
>External: {{ h.get('rating_label') }}</span>
{% else %}
<span class="cell-muted">—</span>
{% endif %}
